name: UI Screenshots

on:
  workflow_dispatch:
    inputs:
      maximal:
        description: Capture fullscreen plots at every viewport
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.62.0"

jobs:
  screenshots:
    name: High-resolution UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: robot-leg-linkage-lab-source-v5/robot-leg-linkage-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: robot-leg-linkage-lab-source-v5/robot-leg-linkage-lab/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install screenshot runtime and Chromium
        shell: bash
        run: |
          mkdir -p .ui-screenshot-runtime
          printf '{"private":true,"type":"module"}\n' > .ui-screenshot-runtime/package.json
          npm install \
            --prefix .ui-screenshot-runtime \
            --no-package-lock \
            --no-save \
            "playwright@${PLAYWRIGHT_VERSION}"
          node .ui-screenshot-runtime/node_modules/playwright/cli.js install --with-deps chromium

      - name: Build static application
        run: npx next build
        env:
          GITHUB_PAGES_BUILD: "true"
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Capture UI
        shell: bash
        run: |
          python3 -m http.server 4173 --directory out > /tmp/ui-screenshot-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [[ "$attempt" == "60" ]]; then
              echo "Static application failed to start"
              cat /tmp/ui-screenshot-server.log
              exit 1
            fi
            sleep 1
          done

          EXTRA_ARGS=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ inputs.maximal }}" == "true" ]]; then
            EXTRA_ARGS+=(--maximal)
          fi

          node scripts/capture-ui.mjs \
            --url http://127.0.0.1:4173/ \
            --out screenshots/ci \
            "${EXTRA_ARGS[@]}"

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ github.sha }}
          path: robot-leg-linkage-lab-source-v5/robot-leg-linkage-lab/screenshots/ci/
          retention-days: 30
          if-no-files-found: error
